<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
<title id="title">Data, AI and software engineering</title><desc id="desc">An animated, lightweight data pipeline connecting data science, machine learning and software engineering.</desc>
<rect width="900" height="150" rx="18" fill="#0d1117"/>
<g stroke="#164e63" stroke-width="2" fill="none"><path d="M190 75 H340 M560 75 H710"/></g>
<g fill="#38bdf8"><circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M190 75 H340"/></circle><circle r="5"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M560 75 H710"/></circle></g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="24" y="39" width="166" height="72" rx="12" fill="#0b2536" stroke="#0e7490"/><text x="107" y="68" font-size="17" font-weight="bold" fill="#e2e8f0">DATA SCIENCE</text><text x="107" y="90" font-size="12" fill="#7dd3fc">Analyze · Discover</text>
<rect x="340" y="39" width="220" height="72" rx="12" fill="#0b2536" stroke="#0e7490"/><text x="450" y="68" font-size="17" font-weight="bold" fill="#e2e8f0">AI / ML</text><text x="450" y="90" font-size="12" fill="#7dd3fc">Model · Evaluate</text>
<rect x="710" y="39" width="166" height="72" rx="12" fill="#0b2536" stroke="#0e7490"/><text x="793" y="68" font-size="16" font-weight="bold" fill="#e2e8f0">SOFTWARE</text><text x="793" y="90" font-size="12" fill="#7dd3fc">Build · Deploy</text>
</g><rect x="24" y="126" width="852" height="2" rx="1" fill="#164e63"/><rect x="24" y="126" width="160" height="2" rx="1" fill="#22d3ee"><animate attributeName="x" values="24;716;24" dur="6s" repeatCount="indefinite"/></rect>
</svg>